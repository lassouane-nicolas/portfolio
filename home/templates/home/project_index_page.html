{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}

<main>
    <h1>{{ page.title }}</h1>

    <section>
        {% for project in projects %}
            <article>
                <h2>{{ project.title }}</h2>
                <p>{{ project.summary }}</p>
                <a href="{{ project.url }}">
                    Découvrir le projet
                </a>
            </article>
        {% empty %}
            <p>Aucun projet disponible pour le moment.</p>
        {% endfor %}
    </section>
</main>

{% endblock content %}
