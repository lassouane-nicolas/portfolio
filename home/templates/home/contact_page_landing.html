{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<main class="container">
    <section class="contact-confirmation" aria-labelledby="confirmation-title">
        <h1 id="confirmation-title">Merci pour votre message !</h1>

        <div class="contact-confirmation-message">
            {{ page.thank_you_text|richtext }}
        </div>

        <a class="contact-return-link" href="{% pageurl page.get_parent %}">
            <span aria-hidden="true">←</span>
            Retour à l'accueil
        </a>
    </section>
</main>
{% endblock content %}
